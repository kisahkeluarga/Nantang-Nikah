<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#FFE14D">
<title>Nantang Nikah</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%23FFE14D%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2243%22%20font-family%3D%22Arial%2C%20Helvetica%2C%20sans-serif%22%20font-weight%3D%22900%22%20font-size%3D%2230%22%20text-anchor%3D%22middle%22%20fill%3D%22%23111111%22%3ENN%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">

</head>
<body>

<div id="viewer">
<button class="arah kiri" id="arah-kiri" aria-label="Halaman sebelumnya">&#8249;</button>
  <button class="arah kanan" id="arah-kanan" aria-label="Halaman berikutnya">&#8250;</button>
</div>

<!-- Popup konfirmasi reset -->
<div class="modal" id="modal-reset" role="dialog" aria-modal="true" aria-labelledby="judul-reset">
  <div class="kotak">
    <h2 id="judul-reset">Hapus semua perkembangan?</h2>
    <p>Semua ceklis pemahaman akan dihapus dan progres kembali ke nol. Tindakan ini tidak bisa dibatalkan.</p>
    <div class="aksi">
      <button type="button" id="batal-reset">Batal</button>
      <button type="button" class="hapus" id="konfirmasi-reset">Hapus Semua</button>
    </div>
  </div>
</div>

<script>
  // Memuat setiap halaman dari folder halaman/, lalu menjalankan js/app.js
  const DAFTAR_HALAMAN = ["sampul", "info-buku", "petunjuk-baca", "progres", "syarat-nikah", "syarat-1", "syarat-2", "siasat-nikah", "siasat-1", "siasat-2", "skala-nikah", "skala-1", "skala-2"];
  const wadahHalaman = document.getElementById('viewer');
  Promise.all(DAFTAR_HALAMAN.map(id =>
    fetch('halaman/' + id + '.html').then(r => {
      if (!r.ok) throw new Error('Gagal memuat ' + id);
      return r.text();
    })
  ))
    .then(bagian => {
      wadahHalaman.insertAdjacentHTML('afterbegin', bagian.join('\n'));
      const s = document.createElement('script');
      s.src = 'js/app.js';
      document.body.appendChild(s);
    })
    .catch(err => {
      console.error(err);
      wadahHalaman.insertAdjacentHTML('afterbegin',
        '<p style="padding:24px;font-family:sans-serif">Halaman gagal dimuat. Buka situs lewat alamat server (misalnya GitHub Pages), bukan dengan membuka file index.html langsung.</p>');
    });
</script>
</body>
</html>
